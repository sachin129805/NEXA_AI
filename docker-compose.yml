services:

  postgres:
    image: postgres:17
    container_name: nexaai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexaai
      POSTGRES_USER: nexaai
      POSTGRES_PASSWORD: nexaai
    ports:
      - "5432:5432"
    volumes:
      - nexaai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexaai -d nexaai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexaai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nexaai_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexaai_postgres_data:
  nexaai_redis_data: